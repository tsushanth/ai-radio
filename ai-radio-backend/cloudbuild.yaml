# Google Cloud Build configuration for Cloud Run deployment
# Optimized for TypeScript Node.js application

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'ai-radio-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend:latest'
      - '.'
    timeout: '600s'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-radio-backend'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # TODO: Configure based on security requirements
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_REDIRECT_URI=https://ai-radio-backend-917362189743.us-central1.run.app/api/auth/oauth/google/callback,GOOGLE_CLIENT_ID=517355381306-o9vf858ti99540b6s21l15gj5dk3d8e2.apps.googleusercontent.com,GOOGLE_CLIENT_SECRET=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'
      # Secrets from Secret Manager
      - '--update-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,OPENAI_API_KEY=openai-key:latest,JWT_SECRET=JWT_SECRET:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ai-radio-backend:latest'

substitutions:
  _REGION: us-central1  # Change to your preferred region
  _REPOSITORY: ai-radio-backend  # Artifact Registry repository name
  _SERVICE_ACCOUNT: 917362189743-compute@developer.gserviceaccount.com

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

