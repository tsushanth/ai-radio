worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name radio.audexa.fm;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS (uncomment after SSL setup)
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Icecast MP3 stream
        location /stream {
            proxy_pass http://icecast:8000/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            # CORS for web players
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
        }

        # Orchestrator API (health, stats, webhooks)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://orchestrator:8081/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Retell webhook (no rate limit — needs to be reliable)
        location /api/webhooks/retell {
            proxy_pass http://orchestrator:8081/api/webhooks/retell;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stream status page
        location /status {
            proxy_pass http://icecast:8000/status.xsl;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment after SSL setup)
    # server {
    #     listen 443 ssl http2;
    #     server_name radio.audexa.fm;
    #
    #     ssl_certificate /etc/letsencrypt/live/radio.audexa.fm/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/radio.audexa.fm/privkey.pem;
    #
    #     # ... same location blocks as above ...
    # }
}
