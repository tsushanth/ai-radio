version: "3.8"

services:
  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: audexa-tts
    restart: unless-stopped
    environment:
      - DEFAULT_TTS_MODEL=kokoro
      - CACHE_ENABLED=true
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - tts_cache:/app/audio_cache
      - tts_voices:/app/voice_samples
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - radio-net

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: audexa-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TTS_SERVICE_URL=http://tts-service:8080
      - LIQUIDSOAP_TELNET_HOST=liquidsoap
      - LIQUIDSOAP_TELNET_PORT=1234
      - QUEUE_READY_DIR=/app/queue/ready
      - QUEUE_RENDERING_DIR=/app/queue/rendering
      - MUSIC_DIR=/app/music
      - JINGLES_DIR=/app/jingles
    ports:
      - "8081:8081"
    volumes:
      - ./queue/ready:/app/queue/ready
      - ./queue/rendering:/app/queue/rendering
      - ./music:/app/music
      - ./jingles:/app/jingles
      - ./logs:/app/logs
      - ~/.claude:/root/.claude:ro  # Claude CLI auth (run `claude login` on host first)
    depends_on:
      tts-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    networks:
      - radio-net

  liquidsoap:
    build:
      context: ./liquidsoap
      dockerfile: Dockerfile
    container_name: audexa-liquidsoap
    restart: unless-stopped
    volumes:
      - ./queue/ready:/queue:ro
      - ./music:/music:ro
      - ./jingles:/jingles:ro
    depends_on:
      - icecast
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    networks:
      - radio-net

  icecast:
    image: infiniteproject/icecast:latest
    container_name: audexa-icecast
    restart: unless-stopped
    volumes:
      - ./icecast/icecast.xml:/etc/icecast2/icecast.xml:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - radio-net

  nginx:
    image: nginx:alpine
    container_name: audexa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - icecast
      - orchestrator
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
    networks:
      - radio-net

volumes:
  tts_cache:
  tts_voices:
  certbot_conf:
  certbot_www:

networks:
  radio-net:
    driver: bridge
