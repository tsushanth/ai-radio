app = "audexa-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_FAILURE_REPORTER_KEY = "0ddf06363a221d55732df23e7dab05af"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"
